services:
  unfold:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unfold-web
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
